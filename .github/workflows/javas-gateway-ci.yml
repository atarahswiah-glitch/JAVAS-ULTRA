name: JAVAS AI gateway checks

on:
  pull_request:
    paths:
      - "supabase/functions/javas-gateway/**"
      - ".github/workflows/javas-gateway-ci.yml"
  push:
    branches:
      - feature/anthropic-supabase-ai-gateway
    paths:
      - "supabase/functions/javas-gateway/**"
      - ".github/workflows/javas-gateway-ci.yml"

permissions:
  contents: read

jobs:
  deno:
    name: Validate Supabase Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno check supabase/functions/javas-gateway/index.ts supabase/functions/javas-gateway/validation.ts supabase/functions/javas-gateway/validation_test.ts
      - name: Unit tests
        run: deno test --allow-env supabase/functions/javas-gateway/validation_test.ts
